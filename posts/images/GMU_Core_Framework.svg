<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GMU Core Framework</title>
  <desc id="desc">Architecture diagram for the GMU Core Framework showing common services and device-specific operations.</desc>
  <rect width="900" height="420" fill="#f5f7fb"/>
  <rect x="60" y="70" width="220" height="260" rx="18" fill="#dfe9ff" stroke="#4f73d9" stroke-width="2"/>
  <text x="170" y="120" text-anchor="middle" font-size="26" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">KGSL Driver</text>
  <text x="170" y="160" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#36455d">GPU Client</text>
  <text x="170" y="194" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#36455d">Request Flow</text>

  <rect x="340" y="40" width="220" height="80" rx="14" fill="#e3f6ea" stroke="#2f9e7e" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">Memory</text>
  <text x="450" y="98" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">Management</text>

  <rect x="340" y="150" width="220" height="80" rx="14" fill="#fff1d8" stroke="#d9971f" stroke-width="2"/>
  <text x="450" y="182" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">IOMMU</text>
  <text x="450" y="208" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">Mapping</text>

  <rect x="340" y="260" width="220" height="80" rx="14" fill="#ffe3e3" stroke="#d94b4b" stroke-width="2"/>
  <text x="450" y="292" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">Clock</text>
  <text x="450" y="318" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">Control</text>

  <rect x="620" y="120" width="220" height="170" rx="18" fill="#e9eaf8" stroke="#5868d9" stroke-width="2"/>
  <text x="730" y="160" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">GMU Core</text>
  <text x="730" y="190" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="#1f2a44" font-weight="700">Framework</text>
  <text x="730" y="230" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#36455d">Trace</text>
  <text x="730" y="256" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#36455d">Device Ops</text>
  <text x="730" y="282" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#36455d">Common services</text>

  <path d="M280 190 H340" stroke="#4b5a7a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 80 H620" stroke="#4b5a7a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 190 H620" stroke="#4b5a7a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 300 H620" stroke="#4b5a7a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5a7a"/>
    </marker>
